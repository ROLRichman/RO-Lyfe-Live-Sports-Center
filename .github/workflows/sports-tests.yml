name: Sports Center browser tests

on:
  push:
    branches: [main, feature/sports-mixed-feed-embed-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Sports Center browser tests
        run: npm test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sports-center-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  sports-backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check API-Sports account status endpoint
        env:
          SUPABASE_URL: https://nzduinxmsmmdbonefifi.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZHVpbnhtc21tZGJvbmVmaWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNDI5NjMsImV4cCI6MjEwODgxODk2M30.N-2jV4a6wU9315lkVCvhDn7tJJ4ryzDHBeItSRztEh8
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/sports-status.json --write-out '%{http_code}' "$SUPABASE_URL/functions/v1/sports-api-status" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept: application/json")"
          echo "API-Sports status-function HTTP: $code"
          cat /tmp/sports-status.json | jq -c .
          if [[ "$code" != "200" ]]; then
            echo "::error::API-Sports status probe failed; inspect the returned upstream status."
            exit 1
          fi
          cat /tmp/sports-status.json | jq -e '.ok == true' >/dev/null
      - name: Check live API-Football fixtures even when status probe fails
        if: always()
        env:
          SUPABASE_URL: https://nzduinxmsmmdbonefifi.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZHVpbnhtc21tZGJvbmVmaWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNDI5NjMsImV4cCI6MjEwODgxODk2M30.N-2jV4a6wU9315lkVCvhDn7tJJ4ryzDHBeItSRztEh8
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/sports-live.json --write-out '%{http_code}' "$SUPABASE_URL/functions/v1/sports-live-scores" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept: application/json")"
          echo "API-Football fixtures-function HTTP: $code"
          cat /tmp/sports-live.json | jq -c .
          if [[ "$code" != "200" ]]; then
            echo "::error::API-Football fixtures request failed; inspect its provider error details."
            exit 1
          fi
          cat /tmp/sports-live.json | jq -e '.ok == true and (.results | type == "number")' >/dev/null
          echo "API-Football live-fixtures endpoint responded successfully."
